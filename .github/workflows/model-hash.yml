name: model-hash
# Verifies the SHA-256 pinned for each downloadable model against the real model file.
on:
  push:
    paths:
      - app/src/main/java/com/ajax/assistant/ModelManager.kt
      - app/src/main/java/com/ajax/assistant/AnswerModel.kt
      - .github/workflows/model-hash.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [ModelManager.kt, AnswerModel.kt]
    name: verify ${{ matrix.source }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and compare
        run: |
          f=app/src/main/java/com/ajax/assistant/${{ matrix.source }}
          url=$(grep -A1 'const val URL_STRING' "$f" | grep -o 'https://[^"]*')
          want=$(grep -o 'const val SHA256 = "[^"]*"' "$f" | cut -d'"' -f2)
          size=$(grep -o 'const val SIZE_BYTES = [0-9_]*' "$f" | grep -o '[0-9_]*$' | tr -d _)
          curl -fL --retry 3 -o model.gguf "$url"
          got=$(sha256sum model.gguf | cut -d' ' -f1)
          got_size=$(stat -c %s model.gguf)
          echo "url=$url"
          echo "size: pinned=$size actual=$got_size"
          echo "sha256: pinned=$want actual=$got"
          test "$got_size" = "$size"
          test "$got" = "$want"
