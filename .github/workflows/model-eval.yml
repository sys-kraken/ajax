name: model-eval
# Runs the phone's exact inference code (llm_core) with the real model, prompt and grammar over
# app/src/test/resources/intent_eval.tsv. Fails if accuracy drops below the bar.
on:
  push:
  workflow_dispatch:
env:
  MIN_ACCURACY: "85"
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Export prompts and grammar from the app code
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'com.ajax.assistant.EvalExportTest'
      - name: Model file (cached by hash)
        id: model
        run: |
          f=app/src/main/java/com/ajax/assistant/ModelManager.kt
          echo "url=$(grep -A1 'const val URL_STRING' "$f" | grep -o 'https://[^"]*')" >> "$GITHUB_OUTPUT"
          echo "sha=$(grep -o 'const val SHA256 = "[^"]*"' "$f" | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: model.gguf
          key: model-${{ steps.model.outputs.sha }}
      - name: Download and verify model
        run: |
          [ -f model.gguf ] || curl -fL --retry 3 -o model.gguf "${{ steps.model.outputs.url }}"
          echo "${{ steps.model.outputs.sha }}  model.gguf" | sha256sum -c -
      - name: Build host eval tool (same llm_core as the phone)
        run: |
          cmake -S app/src/main/cpp -B host-build -DCMAKE_BUILD_TYPE=Release
          cmake --build host-build -j"$(nproc)" --target ajax_eval
      - name: Run eval
        run: |
          host-build/ajax_eval model.gguf app/build/eval | tee eval.txt
          acc=$(grep -o 'accuracy=[0-9.]*' eval.txt | cut -d= -f2)
          echo "### Intent model: ${acc}% (bar ${MIN_ACCURACY}%)" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(FAIL|RESULT)' eval.txt | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          awk -v a="$acc" -v m="$MIN_ACCURACY" 'BEGIN { exit !(a >= m) }'
